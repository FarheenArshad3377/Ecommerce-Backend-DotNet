<div class="account-page">

  <!-- Header — consistent with rest of site -->
  <header class="header">
    <a routerLink="/home" class="logo">RedTag <span>Store</span></a>
    <nav class="nav-links">
      <a routerLink="">Shop</a>
      <a routerLink="/cart">Cart</a>
    </nav>
  </header>

  <main class="account-main">

    <!-- ============ LOGGED IN VIEW ============ -->
    <div class="account-card" *ngIf="isLoggedIn() && user() as u">
      <div class="avatar-circle">
        {{ (u.firstName?.[0] ?? 'U') }}{{ (u.lastName?.[0] ?? '') }}
      </div>

      <h2 class="account-title">My Account</h2>

      <div class="account-info">
        <div class="info-row">
          <span class="info-label">Name</span>
          <span class="info-value">{{ u.firstName }} {{ u.lastName }}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Email</span>
          <span class="info-value">{{ u.email }}</span>
        </div>
      </div>

      <div class="account-links">
        <a routerLink="/orders" class="account-link">
          <span>My Orders</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a routerLink="/cart" class="account-link">
          <span>My Cart</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>

      <button type="button" class="logout-btn" (click)="requestLogout()">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Logout
      </button>
    </div>

    <!-- ============ LOGIN VIEW ============ -->
    <div class="login-card" *ngIf="!isLoggedIn()">
      <h2 class="login-title">Welcome Back</h2>
      <p class="login-subtitle">Login to view your account</p>

      <form (ngSubmit)="onLoginSubmit()">
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
        </div>

        <p class="form-error" *ngIf="formError()">{{ formError() }}</p>

        <button type="submit" class="login-submit-btn">Login</button>
      </form>
    </div>

  </main>

  <!-- Logout confirmation modal -->
  <div class="modal-overlay" *ngIf="showLogoutConfirm()" (click)="cancelLogout()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <h3>Logout?</h3>
      <p>Are you sure you want to logout?</p>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn-cancel" (click)="cancelLogout()">Cancel</button>
        <button type="button" class="modal-btn modal-btn-confirm" (click)="confirmLogout()">Logout</button>
      </div>
    </div>
  </div>

</div>
