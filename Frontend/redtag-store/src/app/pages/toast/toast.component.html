<div class="toast" *ngIf="toastService.toast() as t" [class.success]="t.type === 'success'" [class.error]="t.type === 'error'">
  <svg *ngIf="t.type === 'success'" viewBox="0 0 24 24" width="20" height="20" fill="none">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
    <path d="M8 12.5l2.5 2.5L16 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <svg *ngIf="t.type === 'error'" viewBox="0 0 24 24" width="20" height="20" fill="none">
    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
    <path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <span>{{ t.text }}</span>
</div>
